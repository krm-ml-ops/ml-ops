name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --exclude-mail README.md docs Exam modules Project resources methodical-guidelines"

  reference-project:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/reference-mlops-project
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop ../.. --command uv sync --extra dev --locked
      - run: nix develop ../.. --command ./scripts/verify.sh

  reference-project-mlflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/reference-mlops-project
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop ../.. --command uv sync --extra dev --extra mlflow --locked
      - run: nix develop ../.. --command uv run pytest tests/test_pipeline.py
