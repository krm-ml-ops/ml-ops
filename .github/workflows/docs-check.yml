name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --exclude-mail README.md docs Exam modules Project resources methodical-guidelines"

  reference-project:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/reference-mlops-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: ./scripts/verify.sh
