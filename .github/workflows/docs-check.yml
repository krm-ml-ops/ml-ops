name: Documentation checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-and-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "README.md docs/**/*.md Exam/**/*.md modules/**/*.md Project/**/*.md resources/**/*.md methodical-guidelines/**/*.md team/**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: "--no-progress --exclude-mail README.md docs Exam modules Project resources methodical-guidelines"
