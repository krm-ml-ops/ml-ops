name: CI

on:
  push:
    paths:
      - "resources/reference-mlops-project/**"
  pull_request:
    paths:
      - "resources/reference-mlops-project/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/reference-mlops-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: ./scripts/verify.sh
